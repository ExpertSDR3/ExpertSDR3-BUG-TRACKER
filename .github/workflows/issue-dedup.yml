name: AI Issue Deduplicator

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Номер Issue для проверки (например: 895)'
        required: true
        type: string

permissions:
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check for duplicates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO: ${{ github.repository }}
          TARGET_ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import requests

          gh_token = os.environ["GITHUB_TOKEN"]
          gemini_key = os.environ.get("GEMINI_API_KEY")
          repo = os.environ["REPO"]
          target_num = os.environ.get("TARGET_ISSUE_NUM")

          if not gemini_key:
              print("Ошибка: Секрет GEMINI_API_KEY не задан в настройках репозитория.")
              sys.exit(1)

          gh_headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json"
          }

          # 1. Загружаем целевой Issue
          issue_url = f"https://api.github.com/repos/{repo}/issues/{target_num}"
          r = requests.get(issue_url, headers=gh_headers)
          if r.status_code != 200:
              print(f"Не удалось получить Issue #{target_num}: {r.text}")
              sys.exit(1)

          target_issue = r.json()
          print(f"Проверяем задачу #{target_num}: {target_issue.get('title')}")

          # 2. Получаем последние 50 задач репозитория
          list_url = f"https://api.github.com/repos/{repo}/issues?state=all&per_page=50"
          issues_list = requests.get(list_url, headers=gh_headers).json()

          candidates = []
          for item in issues_list:
              if str(item["number"]) != str(target_num) and "pull_request" not in item:
                  body_preview = (item.get("body") or "")[:250].replace("\n", " ")
                  candidates.append(f"#{item['number']}: {item['title']} (Контекст: {body_preview})")

          if not candidates:
              print("Нет других задач для сравнения.")
              sys.exit(0)

          candidates_text = "\n".join(candidates)

          # 3. Формируем запрос к ИИ
          prompt = f"""Ты — дежурный технический модератор репозитория ExpertSDR3.
          Проверь, дублирует ли новая задача одну из существующих проблем.

          ЦЕЛЕВАЯ ЗАДАЧА:
          #{target_issue['number']}: {target_issue.get('title')}
          Описание:
          {target_issue.get('body', '')}

          ДРУГИЕ ЗАДАЧИ:
          {candidates_text}

          ИНСТРУКЦИЯ:
          - Если ЦЕЛЕВАЯ ЗАДАЧА описывает ту же аппаратную/программную неисправность, что и задача из списка, ответь строго в формате:
          DUPLICATE: #НОМЕР (кратко опиши причину схожести)
          - Если совпадений нет, ответь строго одним словом:
          UNIQUE
          """

          gemini_url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={gemini_key}"
          ai_payload = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }]
          }

          ai_res = requests.post(gemini_url, json=ai_payload)
          if ai_res.status_code != 200:
              print(f"Ошибка Gemini API ({ai_res.status_code}): {ai_res.text}")
              sys.exit(1)

          res_data = ai_res.json()
          answer = res_data["candidates"][0]["content"]["parts"][0]["text"].strip()
          print(f"Ответ ИИ:\n{answer}")

          # 4. Если дубликат — комментируем и ставим метку
          if "DUPLICATE:" in answer:
              comment_body = f"🤖 **AI Issue Deduplicator**\n\n{answer}\n\nПожалуйста, ознакомьтесь с обсуждением в указанном тикете."
              requests.post(
                  f"https://api.github.com/repos/{repo}/issues/{target_num}/comments",
                  headers=gh_headers,
                  json={"body": comment_body}
              )
              requests.post(
                  f"https://api.github.com/repos/{repo}/issues/{target_num}/labels",
                  headers=gh_headers,
                  json={"labels": ["duplicate"]}
              )
              print("Метка duplicate и комментарий успешно добавлены.")
          else:
              print("Дубликатов не обнаружено.")
          EOF
