name: AI Issue Deduplicator

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Номер Issue для проверки (например: 895)'
        required: true
        type: string

permissions:
  models: read
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check for duplicates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import requests

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          target_num = os.environ.get("TARGET_ISSUE_NUM")

          if not target_num:
              print("Ошибка: Номер Issue не задан.")
              sys.exit(1)

          gh_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "GitHub-Action-Issue-Dedup"
          }

          # 1. Загружаем проверяемую задачу
          issue_url = f"https://api.github.com/repos/{repo}/issues/{target_num}"
          r = requests.get(issue_url, headers=gh_headers)
          if r.status_code != 200:
              print(f"Не удалось получить Issue #{target_num}: {r.status_code} {r.text}")
              sys.exit(1)

          target_issue = r.json()
          print(f"Проверяем задачу #{target_num}: {target_issue.get('title')}")

          # 2. Получаем последние 50 задач репозитория
          list_url = f"https://api.github.com/repos/{repo}/issues?state=all&per_page=50"
          list_res = requests.get(list_url, headers=gh_headers)
          if list_res.status_code != 200:
              print(f"Ошибка получения списка задач: {list_res.status_code}")
              sys.exit(1)

          issues_list = list_res.json()
          candidates = []
          for item in issues_list:
              if str(item.get("number")) != str(target_num) and "pull_request" not in item:
                  body_preview = (item.get("body") or "")[:250].replace("\n", " ")
                  candidates.append(f"#{item['number']}: {item['title']} (Контекст: {body_preview})")

          if not candidates:
              print("Нет других задач для сравнения.")
              sys.exit(0)

          candidates_text = "\n".join(candidates)

          # 3. Формируем запрос к ИИ
          prompt = f"""Ты — дежурный технический модератор репозитория ExpertSDR3.
          Проверь, дублирует ли новая задача одну из существующих проблем.

          ЦЕЛЕВАЯ ЗАДАЧА:
          #{target_issue['number']}: {target_issue.get('title')}
          Описание:
          {target_issue.get('body', '')}

          ДРУГИЕ ЗАДАЧИ:
          {candidates_text}

          ИНСТРУКЦИЯ:
          - Если ЦЕЛЕВАЯ ЗАДАЧА описывает ту же аппаратную/программную неисправность, ответь строго в формате:
          DUPLICATE: #НОМЕР (кратко опиши причину схожести)
          - Если совпадений нет, ответь строго одним словом:
          UNIQUE
          """

          ai_headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "GitHub-Action-Issue-Dedup",
              "Accept": "application/json"
          }
          ai_payload = {
              "model": "gpt-4o-mini",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.1,
              "stream": False
          }

          ai_res = requests.post(
              "https://models.github.ai/inference/chat/completions",
              headers=ai_headers,
              json=ai_payload
          )

          print(f"Статус ответа модели: {ai_res.status_code}")
          if ai_res.status_code != 200:
              print(f"Ошибка API GitHub Models ({ai_res.status_code}): {ai_res.text}")
              sys.exit(1)

          raw_text = ai_res.text.strip()
          
          # Парсинг ответа (с защитой от SSE-формата)
          if raw_text.startswith("data:"):
              # Если сервер вернул стрим
              chunks = [line.replace("data: ", "").strip() for line in raw_text.splitlines() if line.startswith("data:") and line.strip() != "data: [DONE]"]
              full_content = ""
              for ch in chunks:
                  try:
                      full_content += json.loads(ch)["choices"][0]["delta"].get("content", "")
                  except:
                      pass
              answer = full_content.strip()
          else:
              try:
                  data = json.loads(raw_text)
                  answer = data["choices"][0]["message"]["content"].strip()
              except Exception as e:
                  print(f"Не удалось распарсить ответ. Сырой текст сервера:\n>>>{raw_text}<<<")
                  sys.exit(1)

          print(f"Ответ ИИ:\n{answer}")

          # 4. Если дубликат — комментируем и ставим метку
          if "DUPLICATE:" in answer:
              comment_body = f"🤖 **AI Issue Deduplicator**\n\n{answer}\n\nПожалуйста, ознакомьтесь с обсуждением в указанном тикете."
              requests.post(
                  f"https://api.github.com/repos/{repo}/issues/{target_num}/comments",
                  headers=gh_headers,
                  json={"body": comment_body}
              )
              requests.post(
                  f"https://api.github.com/repos/{repo}/issues/{target_num}/labels",
                  headers=gh_headers,
                  json={"labels": ["duplicate"]}
              )
              print("Метка duplicate и комментарий добавлены.")
          else:
              print("Дубликатов не обнаружено.")
          EOF
