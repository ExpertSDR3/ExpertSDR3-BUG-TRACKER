name: AI Issue Deduplicator

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Номер Issue для проверки (например: 895)'
        required: true
        type: string

permissions:
  models: read
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Check for duplicates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_ISSUE_NUM: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          python - << 'EOF'
          import os
          import sys
          import json
          import requests

          gh_token = os.environ.get("GITHUB_TOKEN")
          models_token = os.environ.get("MODELS_TOKEN")
          repo = os.environ.get("REPO")
          target_num = os.environ.get("TARGET_ISSUE_NUM")

          if not models_token:
              print("Ошибка: Секрет GH_MODELS_TOKEN не найден в настройках репозитория.")
              sys.exit(1)

          if not target_num:
              print("Ошибка: Номер задачи не передан.")
              sys.exit(1)

          gh_headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "ExpertSDR3-Deduplicator"
          }

          # 1. Загружаем целевой тикет
          issue_url = f"https://api.github.com/repos/{repo}/issues/{target_num}"
          issue_resp = requests.get(issue_url, headers=gh_headers)
          if issue_resp.status_code != 200:
              print(f"Не удалось загрузить Issue #{target_num}: HTTP {issue_resp.status_code}\n{issue_resp.text}")
              sys.exit(1)

          target_issue = issue_resp.json()
          print(f"Проверяем задачу #{target_num}: {target_issue.get('title')}")

          # 2. Получаем список последних 50 тикетов для сравнения
          list_url = f"https://api.github.com/repos/{repo}/issues?state=all&per_page=50"
          list_resp = requests.get(list_url, headers=gh_headers)
          if list_resp.status_code != 200:
              print(f"Ошибка загрузки списка задач: HTTP {list_resp.status_code}\n{list_resp.text}")
              sys.exit(1)

          issues_list = list_resp.json()
          candidates = []
          for item in issues_list:
              if str(item.get("number")) != str(target_num) and "pull_request" not in item:
                  body_preview = (item.get("body") or "")[:250].replace("\n", " ")
                  candidates.append(f"#{item['number']}: {item['title']} (Контекст: {body_preview})")

          print(f"Собрано задач для сравнения: {len(candidates)}")

          if not candidates:
              print("Нет других задач для сопоставления.")
              sys.exit(0)

          candidates_text = "\n".join(candidates)

          # 3. Формируем запрос к модели
          prompt = f"""Ты — дежурный технический модератор репозитория ExpertSDR3.
          Проверь, дублирует ли новая задача одну из существующих проблем.

          ЦЕЛЕВАЯ ЗАДАЧА:
          #{target_issue['number']}: {target_issue.get('title')}
          Описание:
          {target_issue.get('body', '')}

          ДРУГИЕ ЗАДАЧИ:
          {candidates_text}

          ИНСТРУКЦИЯ:
          - Если ЦЕЛЕВАЯ ЗАДАЧА описывает ту же аппаратную/программную неисправность, ответь строго в формате:
          DUPLICATE: #НОМЕР (кратко опиши причину схожести)
          - Если совпадений нет, ответь строго одним словом:
          UNIQUE
          """

          ai_headers = {
              "Authorization": f"Bearer {models_token}",
              "Content-Type": "application/json",
              "User-Agent": "ExpertSDR3-Deduplicator",
              "Accept": "application/json"
          }
          ai_payload = {
              "model": "gpt-4o-mini",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.1,
              "stream": False
          }

          print("Отправка запроса в GitHub Models API...")
          ai_res = requests.post(
              "https://models.github.ai/inference/chat/completions",
              headers=ai_headers,
              json=ai_payload
          )

          if ai_res.status_code != 200:
              print(f"Ошибка API GitHub Models ({ai_res.status_code}):\n{ai_res.text}")
              sys.exit(1)

          raw_text = ai_res.text.strip()
          answer = ""

          # Обработка возможного стрима или чистого JSON
          if "data:" in raw_text:
              for line in raw_text.splitlines():
                  line = line.strip()
                  if line.startswith("data:") and not line.endswith("[DONE]"):
                      try:
                          payload = json.loads(line[5:].strip())
                          choice = payload.get("choices", [{}])[0]
                          delta = choice.get("delta", {}).get("content", "")
                          msg = choice.get("message", {}).get("content", "")
                          answer += (delta or msg)
                      except Exception:
                          pass
              answer = answer.strip()
          else:
              try:
                  data = json.loads(raw_text)
                  answer = data["choices"][0]["message"]["content"].strip()
              except Exception as e:
                  print(f"Ошибка парсинга. Сырой ответ сервера:\n>>>{raw_text}<<<")
                  sys.exit(1)

          print(f"Ответ модели:\n{answer}")

          # 4. Если обнаружен дубликат — комментируем и вешаем метку
          if "DUPLICATE:" in answer:
              comment_body = f"🤖 **AI Issue Deduplicator**\n\n{answer}\n\nПожалуйста, ознакомьтесь с обсуждением в указанном тикете."
              requests.post(
                  f"https://api.github.com/repos/{repo}/issues/{target_num}/comments",
                  headers=gh_headers,
                  json={"body": comment_body}
              )
              requests.post(
                  f"https://api.github.com/repos/{repo}/issues/{target_num}/labels",
                  headers=gh_headers,
                  json={"labels": ["duplicate"]}
              )
              print("Метка duplicate и комментарий добавлены.")
          else:
              print("Дубликатов не обнаружено.")
          EOF
